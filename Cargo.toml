[package]
name = "mvr"
version = "0.2.0"
edition = "2024"
description = "A cli tool that can move and also copy using regex patterns."
license = "GNU AGPLv3"
repository = "https://github.com/sabarish-vm/mvr"
readme = "README.md"
keywords = ["cli", "unix", "rename"]
categories = ["command-line-utilities"]

[dependencies]
regex = "1.12.3"
clap = { version = "4.6.1" }
anyhow = "1.0.102"
dissimilar = "1.0.11"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
